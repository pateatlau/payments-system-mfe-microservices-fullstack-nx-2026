# Content Security Policy Header Include
# Include this file in any location block that defines its own add_header directives
# to ensure CSP is consistently applied.
#
# IMPORTANT: This file requires $csp_nonce variable to be set at server level:
#   set $csp_nonce $request_id;
#
# The CSP policy provides protection against XSS attacks:
# - 'nonce-$csp_nonce': Only scripts/styles with matching nonce can execute
# - 'strict-dynamic': Trusted scripts can load additional scripts
# - NO 'unsafe-inline' in script-src (use nonce instead)
# - NO 'unsafe-eval' in script-src (production builds don't need it)
#
# Note: 'unsafe-inline' is kept in style-src for dev compatibility (style-loader)

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce' 'strict-dynamic' https://embeddable-sandbox.cdn.apollographql.com http://localhost:4200 http://localhost:4201 http://localhost:4202 http://localhost:4203 http://localhost:4204; style-src 'self' 'nonce-$csp_nonce' 'unsafe-inline' https://embeddable-sandbox.cdn.apollographql.com; img-src 'self' data: https: http:; font-src 'self' data: https://embeddable-sandbox.cdn.apollographql.com; connect-src 'self' wss: ws: https: http://localhost:4200 http://localhost:4201 http://localhost:4202 http://localhost:4203 http://localhost:4204; frame-src 'self' https://sandbox.embed.apollographql.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/csp-violations;" always;
