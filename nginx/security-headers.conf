# Security Headers Include
# Include this file in any location block that defines its own add_header directives
# to ensure security headers are always applied.
#
# IMPORTANT: In nginx, add_header directives are NOT inherited when a location
# block defines its own add_header. This include file ensures security headers
# are applied consistently across all locations.

# Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# XSS protection (legacy, but still useful)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
